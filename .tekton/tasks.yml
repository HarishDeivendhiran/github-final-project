
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: node:22
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        rm -rf coverage dist
        echo "Cleanup completed"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-jest
      image: node:22
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
        npm test
